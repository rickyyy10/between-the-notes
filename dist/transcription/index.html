<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音频转简谱试验 · Yi transcription trial</title><link rel="stylesheet" href="trial.css"><body><header><a href="../?lang=zh">← Demo</a><button id="lang">English</button></header><main><p class="eyebrow">118 / 119 · TRANSCRIPTION PILOT</p><h1 data-zh="从人声，到音符。" data-en="From voice to notes."></h1><p class="intro" data-zh="先听原录音，再听两种自动转写。观察算法在哪些地方达成一致，在哪些地方给出不同解释。" data-en="Listen to the original, then to two automatic transcriptions. Inspect where the methods agree—and where they differ."></p><aside data-zh="这是自动转写草稿，尚未由音乐专家校正。简谱数字使用可调的显示参考音，不表示已识别调式；保留真实秒数，不假定拍号。当前没有识别原始和弦。" data-en="Automatic drafts, not expert-corrected scores. Numbers use a selectable display reference, not an inferred key. Timing remains in seconds; no meter or original chords are inferred."></aside><div class="controls"><label><span data-zh="录音" data-en="Recording"></span> <select id="record"><option value="0">118 · 12.6 s</option><option value="1">119 · 9.0 s</option></select></label><label><span data-zh="简谱来源" data-en="Note source"></span> <select id="method"><option value="pyin">pYIN + segmentation</option><option value="basic-pitch">Basic Pitch (raw)</option></select></label><label><span data-zh="显示参考音（非定调）" data-en="Display reference (not key)"></span> <select id="tonic"></select></label></div><h2 data-zh="01 · 听原声与转写" data-en="01 · Listen and compare"></h2><div class="players" id="players"></div><p class="small" data-zh="合成回放使用同一种简单音色，保留估计起止时间，不模拟歌手音色。Basic Pitch 的 WAV 回放不带弯音；另提供保留模型弯音的 MIDI。播放一个音轨时会暂停其他音轨。" data-en="Both drafts use the same simple synthesized tone and estimated timing. They do not imitate the singer. Basic Pitch WAV omits pitch bends; a separate MIDI retains model bends. Starting a track pauses the others."></p><h2 data-zh="02 · 时间轴简谱草稿" data-en="02 · Time-aligned numbered draft"></h2><p class="small" data-zh="横轴是原录音时间，条长表示持续时间；数字上/下的点表示高/低八度。点音符试听原录音中的对应片段。重叠或密集音符会分行，行不代表声部；空白不直接认定为休止符。" data-en="The horizontal axis is original time; bar length is duration. Dots above/below numbers mark octaves. Click a note to hear its original passage. Overlapping or dense notes use separate rows, not separate voices; gaps are not automatically labeled rests."></p><div id="score" class="score"></div><p id="selection" role="status"></p><div id="downloads" class="downloads"></div><details><summary data-zh="查看逐音符数据" data-en="Inspect note data"></summary><div class="table-scroll"><table><thead><tr><th>#</th><th data-zh="起始（秒）" data-en="Start (s)"></th><th data-zh="持续（秒）" data-en="Duration (s)"></th><th data-zh="音名" data-en="Note"></th><th data-zh="简谱数字" data-en="Degree"></th></tr></thead><tbody id="note-table"></tbody></table></div></details><h2 data-zh="03 · 两种方法在哪里不同？" data-en="03 · Where do the methods differ?"></h2><p id="findings"></p><div id="stats" class="stats"></div><p class="small" data-zh="一致率只比较 Basic Pitch 有音符且 pYIN 有有效音高的时刻，取最近的 Basic Pitch 音符。它不是准确率，多音输出也可能提高这一数值。重叠音符需要检查，不能直接认定为真实和弦或错误。" data-en="Agreement uses the nearest Basic Pitch note only where both methods have estimates. It is not accuracy; extra polyphonic notes can inflate it. Overlaps need review and are not automatically real chords or errors."></p><img id="comparison" alt="Continuous pitch and note estimates on shared time and pitch scales"><h2 data-zh="04 · 方法与下载" data-en="04 · Methods and downloads"></h2><p data-zh="pYIN：librosa 音高跟踪，五帧中值平滑、半音量化、删除短于 100 ms 的片段，同音间隔不超过 80 ms 时合并。它可能遗漏重复同音、弱声或短促装饰音；这不是 Tony 软件的输出。" data-en="pYIN: librosa pitch tracking, five-frame median smoothing, semitone rounding, segments under 100 ms removed, equal notes merged across gaps up to 80 ms. Repeated notes, weak sounds and short ornaments may be missed. This is not output from Tony."></p><p data-zh="Basic Pitch 0.4.0：官方 ONNX 模型，默认阈值，最短音符 127.7 ms。保留原始多音输出，不为迎合 pYIN 修改音高。MIDI 的 120 BPM 仅用于存储时间，不是检测出的速度。" data-en="Basic Pitch 0.4.0: official ONNX model, default thresholds, minimum note length 127.7 ms. Raw polyphonic notes are retained without adjustment to agree with pYIN. MIDI's 120 BPM is a storage timebase, not detected tempo."></p><p><a href="results.json" download data-zh="下载完整结果 JSON" data-en="Download full results JSON"></a> · <a href="https://github.com/spotify/basic-pitch">Basic Pitch</a> · <a href="https://librosa.org/doc/latest/generated/librosa.pyin.html">librosa pYIN</a> · <a href="https://sonicvisualiser.org/tony/">Tony</a></p><p class="small" data-zh="后续应对照录音人工检查音符边界、八度、滑音和调式，再决定是否制作正式简谱或编配候选和弦。" data-en="Next: manually review boundaries, octaves, slides and tonal interpretation before engraving a score or arranging candidate chords."></p></main><script src="trial.js" type="module"></script></body></html>
